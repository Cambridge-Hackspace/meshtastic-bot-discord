[package]
name = "meshtastic-bot-discord"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serenity = { version = "0.12.5", features = ["client", "gateway", "rustls_backend", "model"] }
tokio = { version = "1.50.0", features = ["macros", "rt-multi-thread"] }
toml = "1.1.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
